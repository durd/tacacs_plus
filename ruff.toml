target-version = "py310"

# Rules that point at bugs: syntax errors, pyflakes (undefined names,
# unused imports, ...) and a few pycodestyle errors; pyupgrade so Python 2
# idioms (like %-formatting) don't come back; and logging-format, so log
# calls pass their arguments instead of formatting them eagerly.  No line
# length or formatting rules.
[lint]
select = ["E4", "E7", "E9", "F", "UP", "G"]
