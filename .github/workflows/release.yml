name: release

# Push a tag like v3.0.0 (matching `version` in setup.py) to build the wheel
# and sdist and publish them as a GitHub release.
#
# Two jobs, so the token that can write releases never sits next to
# third-party code: `build` (pip, pytest, setuptools) only has read access,
# and `publish` runs nothing but GitHub's download-artifact and `gh`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Check that the tag matches setup.py
        run: |
          version=$(python -c "import re; print(re.search(r\"^version = '(.+)'\", open('setup.py').read(), re.M)[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != setup.py version $version"; exit 1; }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: List what gets released
        run: ls -l dist && sha256sum dist/*
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
